<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Нативная плотность знаний</title>
<meta name="description" content="Нативная плотность знаний: классификации и пороги для КТ. Справочник для врачей и ординаторов.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)">
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --ink: #1f2328; --muted: #5f6670;
    --line: #dcdfe3; --head: #eef1f4; --accent: #1d5fa8;
    --warn-bg: #fff6e0; --warn: #7a5200; --err: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121417; --card: #1b1e22; --ink: #e6e8eb; --muted: #9aa3ad;
      --line: #2e333a; --head: #23272d; --accent: #7fb2ee;
      --warn-bg: #2e2715; --warn: #e9c46a; --err: #ff8a80;
    }
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; scroll-padding-top: 76px; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 12px; }

  /* Шапка с поиском — всегда под пальцем */
  header.top { position: sticky; top: 0; z-index: 10; background: var(--bg);
    border-bottom: 1px solid var(--line);
    padding: max(8px, env(safe-area-inset-top)) 0 8px; }
  .bar { display: flex; gap: 8px; align-items: center; }
  #q { flex: 1; min-width: 0; height: 44px; padding: 0 12px; font-size: 16px;
    border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); }
  .tool { flex: none; height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 10px;
    background: var(--card); color: var(--ink); font-size: 0.85rem; cursor: pointer; }

  h1 { margin: 14px 0 0; font-size: 1.05rem; font-weight: 600; }
  .note { margin: 10px 0 0; padding: 10px 12px; border-radius: 10px; background: var(--warn-bg);
    color: var(--warn); font-size: 0.85rem; }
  .note p { margin: 4px 0; }
  .err { margin: 10px 0; padding: 10px 12px; border-radius: 10px; border: 1px dashed var(--err);
    color: var(--err); font-size: 0.85rem; }

  /* Разделы-гармошки */
  details.sec { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin: 10px 0; }
  details.sec[hidden] { display: none; }
  details.sec > summary { list-style: none; cursor: pointer; padding: 12px 40px 12px 14px;
    position: relative; -webkit-tap-highlight-color: transparent; min-height: 48px; }
  details.sec > summary::-webkit-details-marker { display: none; }
  details.sec > summary::after { content: ""; position: absolute; right: 16px; top: 20px;
    width: 8px; height: 8px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted);
    transform: rotate(45deg); transition: transform .15s; }
  details.sec[open] > summary::after { transform: rotate(-135deg); top: 24px; }
  .t { display: block; font-size: 1.02rem; font-weight: 600; line-height: 1.3; }
  .s { display: block; margin-top: 3px; font-size: 0.82rem; color: var(--muted); line-height: 1.35; }
  .body { padding: 0 14px 12px; border-top: 1px solid var(--line); }

  h3 { margin: 16px 0 6px; font-size: 0.95rem; }
  p, ul { margin: 8px 0; }
  ul { padding-left: 1.2em; }
  li { margin: 3px 0; }
  code.formula { display: block; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.88rem;
    background: var(--head); padding: 8px 10px; border-radius: 8px; overflow-x: auto; white-space: nowrap; }
  code { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 0.9em; }
  .src { margin-top: 12px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 0.8rem; color: var(--muted); }
  a { color: var(--accent); }

  /* Таблицы: на телефоне каждая строка — карточка с подписями колонок */
  table { border-collapse: collapse; width: 100%; font-size: 0.9rem; margin: 8px 0; }
  th, td { border: 1px solid var(--line); padding: 7px 9px; text-align: left; vertical-align: top; }
  th { background: var(--head); font-weight: 600; }
  td:first-child { font-weight: 600; width: 22%; }
  @media (max-width: 640px) {
    table, tbody, tr, td { display: block; width: auto; }
    thead { display: none; }
    tr { border: 1px solid var(--line); border-radius: 10px; margin: 8px 0; overflow: hidden; }
    td { border: 0; border-top: 1px solid var(--line); }
    td:first-child { border-top: 0; background: var(--head); width: auto; }
    td:not(:first-child)::before { content: attr(data-label); display: block;
      font-size: 0.75rem; color: var(--muted); margin-bottom: 1px; }
  }

  /* Шаблоны заключений */
  .study { margin: 14px 0 6px; display: flex; flex-direction: column; gap: 10px; }
  .study[hidden] { display: none; }
  .picks { display: flex; flex-wrap: wrap; gap: 6px; }
  .pick { padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card);
    color: var(--ink); font-size: 0.88rem; cursor: pointer; text-align: left; }
  .pick[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .study h2 { margin: 0; font-size: 1.1rem; line-height: 1.3; }
  .study h2 small { display: block; font-size: 0.78rem; font-weight: 400; color: var(--muted); margin-top: 2px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  .tab { height: 34px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px;
    background: transparent; color: var(--muted); font-size: 0.85rem; cursor: pointer; }
  .tab[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .sheet { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .sheet-bar { display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 6px 6px 6px 14px; border-bottom: 1px solid var(--line); background: var(--head);
    font-size: 0.8rem; color: var(--muted); }
  .copy { height: 38px; padding: 0 16px; border: 0; border-radius: 8px; background: var(--accent);
    color: var(--bg); font-size: 0.9rem; font-weight: 600; cursor: pointer; }
  .sheet pre { margin: 0; padding: 12px 14px; font: 0.88rem/1.6 ui-monospace, Menlo, Consolas, monospace;
    white-space: pre-wrap; word-break: break-word; }
  .hints-h { margin: 6px 0 -4px; font-size: 0.78rem; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; color: var(--muted); }
  .study details.sec { margin: 0; }
  .toast { position: fixed; left: 50%; transform: translateX(-50%); z-index: 20;
    bottom: calc(20px + env(safe-area-inset-bottom)); background: var(--ink); color: var(--bg);
    padding: 10px 16px; border-radius: 10px; font-size: 0.9rem; font-weight: 600; }
  .toast[hidden] { display: none; }

  .empty { text-align: center; color: var(--muted); padding: 24px 0; }
  footer { color: var(--muted); font-size: 0.8rem; padding: 16px 0 max(32px, env(safe-area-inset-bottom)); }

  /* Стартовая страница: только строка поиска */
  body.home header.top { position: static; border-bottom: 0; padding-top: 30vh; }
  body.home .bar { max-width: 620px; }
  body.home #q { height: 54px; padding: 0 18px; font-size: 18px; border-radius: 14px;
    box-shadow: 0 2px 12px rgba(0, 0, 0, .06); }
  body.home #q:focus { outline: none; border-color: var(--accent); }
  body.home main { display: none; }
  body.home footer { position: fixed; left: 0; right: 0; bottom: 0; text-align: center; font-size: 0.72rem; }
</style>
</head>
<body>
<script>if (!location.hash) document.body.classList.add("home");</script>

  <h3>Помощник рентгенолога</h3>
<header class="top"><div class="wrap bar">
  <input id="q" type="search" placeholder="Что описываем?" autofocus autocomplete="off" enterkeyhint="search" aria-label="Поиск">
</div></header>

<main class="wrap">
  <div id="note"></div>
  <section class="study" id="study" hidden></section>
  <div id="list"><p class="empty">Загрузка…</p></div>
  <p class="empty" id="none" hidden>Ничего не найдено.</p>
</main>

<footer class="wrap">Справочный материал для врачей и ординаторов, не клиническая рекомендация.</footer>
<div class="toast" id="toast" hidden></div>

<script>
/* =====================================================================
   Менять этот файл не нужно.
   Тексты лежат в папке ru/, порядок разделов — в ru/order.txt.
   Шаблоны заключений — в папке templates/, порядок — в templates/order.txt.
   Как оформлять тексты — см. README.md в корне репозитория.
   ===================================================================== */
(function () {
  const DIR = "ru/";
  const listEl = document.getElementById("list");
  const noteEl = document.getElementById("note");
  const q = document.getElementById("q");
  const none = document.getElementById("none");

  if (location.protocol === "file:") {
    listEl.innerHTML = '<p class="err">Страница открыта как файл с диска, а браузер не даёт ей читать соседние файлы. ' +
      'Смотрите опубликованный сайт или откройте репозиторий через github.dev.</p>';
    return;
  }

  /* ---------- Мини-разметка: подмножество Markdown ---------- */
  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  function inline(s) {
    s = esc(s).replace(/&lt;br\s*\/?&gt;/gi, "<br>");
    s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
    s = s.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
    s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
    return s;
  }
  const cells = line => line.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim());

  function parse(text) {
    const lines = text.replace(/\r/g, "").split("\n");
    const out = { title: "", sub: "", html: "" };
    let html = "", para = [], list = [];
    const flushP = () => { if (para.length) { html += "<p>" + inline(para.join(" ")) + "</p>"; para = []; } };
    const flushL = () => { if (list.length) { html += "<ul>" + list.map(x => "<li>" + inline(x) + "</li>").join("") + "</ul>"; list = []; } };
    const flush = () => { flushP(); flushL(); };

    for (let i = 0; i < lines.length; i++) {
      const raw = lines[i], t = raw.trim();
      if (!t) { flush(); continue; }
      if (/^# /.test(t) && !out.title) { flush(); out.title = t.slice(2).trim(); continue; }
      if (/^##+ /.test(t)) { flush(); html += "<h3>" + inline(t.replace(/^##+ /, "")) + "</h3>"; continue; }
      if (/^> ?/.test(t) && !out.sub && !html) { flush(); out.sub = t.replace(/^> ?/, ""); continue; }
      if (t.startsWith("|")) {
        flush();
        const rows = [];
        while (i < lines.length && lines[i].trim().startsWith("|")) { rows.push(lines[i].trim()); i++; }
        i--;
        const head = cells(rows[0]);
        const body = rows.slice(1).filter(r => !/^\|?[\s:|-]+\|?$/.test(r)).map(cells);
        html += "<table><thead><tr>" + head.map(h => "<th>" + inline(h) + "</th>").join("") + "</tr></thead><tbody>" +
          body.map(r => "<tr>" + head.map((h, k) =>
            '<td data-label="' + esc(h) + '">' + inline(r[k] || "") + "</td>").join("") + "</tr>").join("") +
          "</tbody></table>";
        continue;
      }
      if (/^[-*] /.test(t)) { flushP(); list.push(t.slice(2)); continue; }
      if (/^`[^`]+`$/.test(t)) { flush(); html += '<code class="formula">' + esc(t.slice(1, -1)) + "</code>"; continue; }
      if (/^Источник:/.test(t)) { flush(); html += '<p class="src">' + inline(t) + "</p>"; continue; }
      flushL(); para.push(t);
    }
    flush();
    out.html = html;
    return out;
  }

  /* ---------- Загрузка ---------- */
  const get = f => fetch(DIR + f, { cache: "no-cache" }).then(r => {
    if (!r.ok) throw new Error(r.status);
    return r.text();
  });

  get("order.txt").then(txt => {
    const files = txt.split("\n").map(s => s.trim()).filter(s => s && !s.startsWith("#"));
    return Promise.all(files.map(f => get(f).then(t => ({ f, t }), () => ({ f, t: null }))));
  }).then(items => {
    listEl.innerHTML = "";
    const parsed = {};
    items.forEach(({ f, t }) => {
      if (t !== null) parsed[f.replace(/\.md$/i, "")] = t;
      if (t === null) {
        listEl.insertAdjacentHTML("beforeend", '<p class="err">Не найден файл ' + esc(DIR + f) + ' — проверьте имя в order.txt</p>');
        return;
      }
      if (f === "about.md") { noteEl.innerHTML = '<div class="note">' + parse(t).html + "</div>"; return; }
      const d = parse(t);
      const sec = document.createElement("details");
      sec.className = "sec";
      sec.id = f.replace(/\.md$/i, "");
      sec.innerHTML = "<summary><span class=\"t\">" + inline(d.title || f) + "</span>" +
        (d.sub ? '<span class="s">' + inline(d.sub) + "</span>" : "") + "</summary>" +
        '<div class="body">' + d.html + "</div>";
      listEl.appendChild(sec);
    });
    setup();
    templates(parsed);
  }).catch(() => {
    listEl.innerHTML = '<p class="err">Не удалось прочитать ru/order.txt.</p>';
  });

  /* ---------- Поиск, «раскрыть всё», ссылки на раздел ---------- */
  function setup() {
    const secs = Array.from(document.querySelectorAll("details.sec"));
    const norm = s => s.toLowerCase().replace(/ё/g, "е");
    const texts = secs.map(s => norm(s.textContent));

    q.addEventListener("input", () => {
      const wasHome = document.body.classList.contains("home");
      document.body.classList.toggle("home", !q.value.trim());
      if (wasHome && q.value.trim()) window.scrollTo(0, 0);
      const words = norm(q.value).split(/\s+/).filter(Boolean);
      let shown = 0;
      secs.forEach((s, i) => {
        const ok = words.every(w => texts[i].includes(w));
        s.hidden = !ok;
        s.open = ok && words.length > 0;      // найденное — сразу раскрыто
        if (ok) shown++;
      });
      none.hidden = shown > 0;
    });


    // открытый раздел попадает в адрес — ссылкой можно поделиться
    secs.forEach(s => s.addEventListener("toggle", () => {
      if (s.open && !q.value) history.replaceState(null, "", "#" + s.id);
    }));
    const target = location.hash && document.getElementById(location.hash.slice(1));
    if (target && target.tagName === "DETAILS") { target.open = true; target.scrollIntoView(); }
  }

  /* ---------- Шаблоны заключений ---------- */
  const TDIR = "templates/";
  const studyEl = document.getElementById("study");
  const toastEl = document.getElementById("toast");
  const lower = s => s.toLowerCase().replace(/ё/g, "е");
  const tokens = s => lower(s).replace(/[^a-zа-я0-9]+/g, " ").split(" ").filter(Boolean);
  // слова, без которых запрос не меняется: «кт органов грудной клетки» = «грудной клетки»
  const STOP = new Set(["кт", "мскт", "органов", "орган", "органы", "исследование", "описание", "и", "с", "без"]);
  const stem = w => w.length > 4 ? w.slice(0, w.length - 2) : w;

  function readTemplate(f, t) {
    const lines = t.replace(/\r/g, "").split("\n");
    const cut = lines.findIndex(l => l.trim() === "---");
    if (cut < 0) return null;
    const meta = {};
    lines.slice(0, cut).forEach(l => {
      const m = l.match(/^\s*([^:#]+):\s*(.*)$/);
      if (m) meta[lower(m[1].trim())] = m[2].trim();
    });
    const text = lines.slice(cut + 1).join("\n").replace(/^\n+|\s+$/g, "");
    const study = meta["исследование"];
    if (!study || !text) return null;
    return {
      f, study, text,
      variant: meta["вариант"] || "Основной",
      modality: meta["модальность"] || "",
      hints: (meta["подсказки"] || "").split(/[,\s]+/).map(s => s.replace(/\.md$/i, "")).filter(Boolean),
      words: tokens([study, meta["вариант"], meta["модальность"], meta["слова"]].join(" "))
    };
  }

  function score(words, v) {
    let s = 0;
    for (const w of words) {
      const st = stem(w);
      if (v.words.some(k => k.startsWith(st) || (k.length > 3 && st.startsWith(k)))) s++;
      else return 0;
    }
    return s;
  }

  function templates(sections) {
    get_t("order.txt").then(txt => {
      const files = txt.split("\n").map(s => s.trim()).filter(s => s && !s.startsWith("#"));
      return Promise.all(files.map(f => get_t(f).then(t => readTemplate(f, t), () => null)));
    }).then(list => {
      const variants = list.filter(Boolean);
      if (!variants.length) return;
      const studies = [];
      variants.forEach(v => {
        let s = studies.find(x => x.title === v.study);
        if (!s) { s = { title: v.study, modality: v.modality, variants: [] }; studies.push(s); }
        s.variants.push(v);
      });
      const hintCache = {};
      const hint = name => {
        if (sections[name] !== undefined) return Promise.resolve(sections[name]);
        if (!hintCache[name]) hintCache[name] = get(name + ".md").catch(() => null);
        return hintCache[name];
      };


      let current = null;
      function show(found, words, keep) {
        if (!found.length) { studyEl.hidden = true; studyEl.innerHTML = ""; current = null; return; }
        if (!keep || !found.includes(current)) current = found[0];
        const s = current;
        let vi = 0, best = -1;
        s.variants.forEach((v, i) => { const sc = score(words, v); if (sc > best) { best = sc; vi = i; } });
        render(found, s, vi);
      }
      function render(found, s, vi) {
        current = s;
        const v = s.variants[vi];
        studyEl.hidden = false;
        studyEl.innerHTML =
          (found.length > 1 ? '<div class="picks">' + found.map((x, i) =>
            '<button type="button" class="pick" data-i="' + i + '" aria-pressed="' + (x === s) + '">' + esc(x.title) + "</button>").join("") + "</div>" : "") +
          "<h2>" + esc(s.title) + (s.modality ? "<small>" + esc(s.modality) + "</small>" : "") + "</h2>" +
          (s.variants.length > 1 ? '<div class="tabs" role="tablist">' + s.variants.map((x, i) =>
            '<button type="button" class="tab" role="tab" data-v="' + i + '" aria-selected="' + (i === vi) + '">' + esc(x.variant) + "</button>").join("") + "</div>" : "") +
          '<div class="sheet"><div class="sheet-bar"><span>Шаблон · ' + esc(v.variant) + '</span>' +
          '<button type="button" class="copy">Скопировать</button></div><pre></pre></div>' +
          (v.hints.length ? '<div class="hints-h">Подсказки</div><div class="hints"></div>' : "");
        studyEl.querySelector("pre").textContent = v.text;
        studyEl.querySelectorAll(".pick").forEach(b => b.onclick = () => render(found, found[+b.dataset.i], 0));
        studyEl.querySelectorAll(".tab").forEach(b => b.onclick = () => render(found, s, +b.dataset.v));
        studyEl.querySelector(".copy").onclick = () => copy(v.text, studyEl.querySelector("pre"));
        const box = studyEl.querySelector(".hints");
        if (box) Promise.all(v.hints.map(hint)).then(texts => {
          if (current !== s || !box.isConnected) return;
          texts.forEach((t, i) => {
            const d = document.createElement("details");
            d.className = "sec";
            if (t === null) { box.insertAdjacentHTML("beforeend", '<p class="err">Нет подсказки ' + esc(DIR + v.hints[i]) + '.md — проверьте строку «Подсказки:» в ' + esc(TDIR + v.f) + "</p>"); return; }
            const p = parse(t);
            d.innerHTML = "<summary><span class=\"t\">" + inline(p.title || v.hints[i]) + "</span>" +
              (p.sub ? '<span class="s">' + inline(p.sub) + "</span>" : "") + "</summary>" +
              '<div class="body">' + p.html + "</div>";
            if (i === 0) d.open = true;
            box.appendChild(d);
          });
        });
      }

      q.addEventListener("input", () => {
        const words = tokens(q.value).filter(w => !STOP.has(w));
        if (!words.length) { show([], words); return; }
        const found = studies.map(s => ({ s, sc: Math.max(...s.variants.map(v => score(words, v))) }))
          .filter(x => x.sc > 0).sort((a, b) => b.sc - a.sc).map(x => x.s);
        show(found, words, true);
        if (found.length) none.hidden = true;
      });
      if (q.value) q.dispatchEvent(new Event("input"));
    }).catch(() => { /* нет папки templates — сайт работает как раньше */ });
  }
  const get_t = f => fetch(TDIR + f, { cache: "no-cache" }).then(r => {
    if (!r.ok) throw new Error(r.status);
    return r.text();
  });

  let toastTimer;
  function toast(m) {
    toastEl.textContent = m; toastEl.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => { toastEl.hidden = true; }, 1800);
  }
  function copy(text, pre) {
    const fallback = () => {
      const r = document.createRange(); r.selectNodeContents(pre);
      const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r);
      try { document.execCommand("copy") ? toast("Скопировано") : toast("Текст выделен — скопируйте вручную"); }
      catch (e) { toast("Текст выделен — скопируйте вручную"); }
    };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(() => toast("Скопировано"), fallback);
    else fallback();
  }
})();
</script>
</body>
</html>
